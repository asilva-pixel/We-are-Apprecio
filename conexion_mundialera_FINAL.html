<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are Apprecio — Conexión Mundialera 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red:       #FA345E;
  --red-dark:  #D42048;
  --red-deep:  #A01535;
  --lavender:  #B2A8E7;
  --lav-light: #EAE7FF;
  --mint:      #45C1AD;
  --mint-light:#D6F5F1;
  --green:     #97E89F;
  --lime:      #D7FAB6;
  --dark:      #1B1B1B;
  --white:     #FFFFFF;
  --pink-soft: #FFE6E8;
  --bg:        #FA345E;
  --card:      #FFFFFF;
  --border:    rgba(255,255,255,0.15);
  --radius:    16px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--red);color:var(--white);min-height:100vh;}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.04em;}

/* ── NOISE TEXTURE OVERLAY ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.4;
}

/* ── LOGIN ── */
#loginScreen{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 1rem;position:relative;z-index:1;
}
.login-logo{margin-bottom:2rem;text-align:center;}
.login-logo img{height:48px;filter:brightness(0) invert(1);}
.login-hero{text-align:center;margin-bottom:2.5rem;}
.login-hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.25);
  color:white;font-size:11px;font-weight:700;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:5px 14px;border-radius:20px;margin-bottom:18px;
}
.login-hero h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(44px,10vw,80px);
  line-height:0.92;color:white;margin-bottom:12px;
}
.login-hero h1 em{color:var(--lime);font-style:normal;}
.login-hero p{font-size:14px;color:rgba(255,255,255,0.75);font-style:italic;}

.login-card{
  background:var(--white);border-radius:var(--radius);
  padding:2rem;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,0.25);
}
.login-card h3{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.login-card .sub{font-size:13px;color:#888;margin-bottom:1.5rem;}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#888;display:block;margin-bottom:5px;}
.field input{
  width:100%;padding:11px 14px;
  border:1.5px solid #E8E8E8;border-radius:var(--radius-sm);
  font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;
  background:#FAFAFA;color:var(--dark);outline:none;
  transition:border-color 0.2s,background 0.2s;
}
.field input:focus{border-color:var(--red);background:white;}
.btn-main{
  width:100%;padding:13px;
  background:var(--red);color:white;
  border:none;border-radius:var(--radius-sm);
  font-size:15px;font-weight:700;
  font-family:'Plus Jakarta Sans',sans-serif;
  cursor:pointer;transition:background 0.2s,transform 0.1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-main:hover{background:var(--red-dark);}
.btn-main:active{transform:scale(0.98);}
.login-err{font-size:12px;color:var(--red);text-align:center;margin-top:10px;min-height:18px;font-weight:500;}
.login-note{font-size:11px;color:#aaa;text-align:center;margin-top:12px;}

/* ── APP SHELL ── */
#appScreen{display:none;min-height:100vh;flex-direction:column;}

/* NAV */
.app-nav{
  background:var(--dark);padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;position:sticky;top:0;z-index:100;
  border-bottom:3px solid var(--red);
}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo img{height:28px;filter:brightness(0) invert(1);}
.nav-divider{width:1px;height:24px;background:rgba(255,255,255,0.15);}
.nav-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:white;letter-spacing:0.05em;}
.nav-title span{color:var(--lime);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-chip{
  background:rgba(255,255,255,0.1);color:white;
  font-size:12px;padding:5px 12px;border-radius:20px;
  display:flex;align-items:center;gap:6px;font-weight:500;
}
.btn-logout{
  background:none;border:1px solid rgba(255,255,255,0.25);
  color:rgba(255,255,255,0.6);font-size:12px;padding:5px 10px;
  border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  transition:all 0.2s;
}
.btn-logout:hover{border-color:white;color:white;}

/* TABS */
.app-tabs{
  background:var(--dark);border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex;padding:0 20px;position:sticky;top:58px;z-index:99;
}
.tab-btn{
  padding:13px 18px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,0.45);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
}
.tab-btn.active{color:var(--lime);border-bottom-color:var(--lime);}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.75);}

/* CONTENT */
.app-body{flex:1;background:#F7F5F2;}
.app-content{max-width:720px;margin:0 auto;padding:20px;width:100%;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* SECTION HEAD */
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:2px solid var(--dark);
}
.sec-head h2{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--dark);}
.sec-head span{font-size:12px;color:#888;}

/* HOME HERO STRIP */
.home-hero{
  background:var(--dark);border-radius:var(--radius);
  padding:20px 24px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
}
.home-hero::after{
  content:'⚽';position:absolute;right:-8px;bottom:-16px;
  font-size:90px;opacity:0.06;
}
.home-hero-left .greet{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:4px;}
.home-hero-left .name{font-family:'Bebas Neue',sans-serif;font-size:26px;color:white;line-height:1;}
.home-hero-left .name span{color:var(--lime);}
.home-hero-right{text-align:right;}
.home-hero-right .pts-val{font-family:'Bebas Neue',sans-serif;font-size:44px;color:var(--lime);line-height:1;}
.home-hero-right .pts-lbl{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-box{
  background:white;border:1px solid #EBEBEB;
  border-radius:var(--radius-sm);padding:14px 16px;text-align:center;
}
.stat-box .v{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--dark);line-height:1;}
.stat-box .l{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

/* PHASE LABEL */
.phase-lbl{
  font-size:10px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:#999;
  margin:20px 0 8px;display:flex;align-items:center;gap:8px;
}
.phase-lbl::after{content:'';flex:1;height:1px;background:#E8E8E8;}

/* MATCH CARD */
.match-card{
  background:white;border:1px solid #EBEBEB;
  border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;
  transition:box-shadow 0.2s;
}
.match-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.07);}
.match-card.highlight{border-left:3px solid var(--red);}
.match-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.match-date{font-size:11px;color:#999;}
.badges{display:flex;gap:6px;align-items:center;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;}
.badge-open{background:#FFE6E8;color:var(--red);}
.badge-played{background:var(--mint-light);color:#1A8070;}
.badge-locked{background:#F3F3F3;color:#aaa;}
.pts-chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.pts-exact{background:var(--mint-light);color:#1A8070;}
.pts-winner{background:var(--lav-light);color:#5B4DB5;}
.pts-miss{background:#F3F3F3;color:#aaa;}

.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
.team-block{display:flex;align-items:center;gap:8px;}
.team-block.away{flex-direction:row-reverse;text-align:right;}
.flag{font-size:24px;}
.tname{font-size:13px;font-weight:600;color:var(--dark);}
.score-block{display:flex;align-items:center;gap:6px;}
.score-inp{
  width:42px;height:42px;text-align:center;
  border:1.5px solid #E8E8E8;border-radius:var(--radius-sm);
  font-size:18px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;
  background:#FAFAFA;color:var(--dark);outline:none;transition:border-color 0.2s;
}
.score-inp:focus{border-color:var(--red);}
.score-inp:disabled{background:#F5F5F5;color:#ccc;cursor:default;}
.sep{font-size:20px;color:#ddd;font-weight:300;}
.match-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;padding-top:10px;border-top:1px solid #F0F0F0;
}
.real-res{font-size:12px;color:#999;}
.real-res strong{color:var(--dark);}
.btn-save{
  background:var(--red);color:white;border:none;
  padding:7px 16px;border-radius:var(--radius-sm);
  font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.2s;
}
.btn-save:hover{background:var(--red-dark);}

/* LEADERBOARD */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.pod-card{
  background:white;border:1px solid #EBEBEB;
  border-radius:var(--radius);padding:16px 10px;text-align:center;
  position:relative;overflow:hidden;
}
.pod-card.p1{border-color:var(--red);background:var(--pink-soft);}
.pod-card.p1::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red);}
.pod-medal{font-size:26px;margin-bottom:6px;}
.pod-name{font-size:12px;font-weight:700;color:var(--dark);line-height:1.2;margin-bottom:2px;}
.pod-pts{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--red);}
.pod-sub{font-size:11px;color:#aaa;}

.lb-list{background:white;border:1px solid #EBEBEB;border-radius:var(--radius);overflow:hidden;}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #F5F5F5;transition:background 0.15s;}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:var(--pink-soft);}
.lb-rank{font-size:13px;color:#aaa;min-width:22px;text-align:center;font-weight:700;}
.lb-av{
  width:34px;height:34px;border-radius:50%;
  background:var(--red);color:white;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.lb-av.mint{background:var(--mint);}
.lb-av.lav{background:var(--lavender);}
.lb-info{flex:1;min-width:0;}
.lb-name{font-size:13px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-country{font-size:11px;color:#aaa;}
.lb-pts{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--red);}

/* PRIZES */
.prize-banner{
  background:var(--dark);border-radius:var(--radius);
  padding:24px;margin-bottom:14px;color:white;text-align:center;
  position:relative;overflow:hidden;
}
.prize-banner::before{content:'🏆';position:absolute;right:-10px;bottom:-14px;font-size:90px;opacity:0.07;}
.prize-banner h2{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--lime);margin-bottom:4px;}
.prize-banner p{font-size:13px;opacity:0.65;}
.prize-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.prize-item{
  background:white;border:1px solid #EBEBEB;
  border-radius:var(--radius-sm);padding:16px;
  display:flex;align-items:center;gap:12px;
}
.p-flag{font-size:30px;}
.p-country{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;}
.p-amount{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--dark);}
.rules-block{background:white;border:1px solid #EBEBEB;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}
.rules-head{background:#F7F7F7;padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#888;border-bottom:1px solid #EBEBEB;}
.rule-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid #F5F5F5;}
.rule-row:last-child{border-bottom:none;}
.rule-dot{width:38px;height:38px;border-radius:50%;background:var(--dark);color:white;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;flex-shrink:0;}
.rule-dot.red{background:var(--red);}
.rule-dot.gray{background:#bbb;}
.rule-txt{font-size:13px;color:var(--dark);line-height:1.4;}
.rule-sub{font-size:11px;color:#aaa;margin-top:1px;}

/* LOADING / TOAST */
.load-bar{height:2px;background:#E8E8E8;border-radius:2px;overflow:hidden;margin-bottom:16px;}
.load-fill{height:100%;background:var(--red);animation:la 1.2s ease-in-out infinite;}
@keyframes la{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:white;
  padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,0.2);z-index:1000;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
  border-left:3px solid var(--lime);
}
.toast.show{opacity:1;}
.empty{text-align:center;padding:3rem 1rem;color:#aaa;}
.empty .ic{font-size:40px;margin-bottom:10px;}
.refresh-btn{background:none;border:1px solid #E0E0E0;color:#aaa;font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-left:8px;}
.refresh-btn:hover{border-color:var(--red);color:var(--red);}

@media(max-width:480px){
  .app-content{padding:14px;}
  .tname{font-size:12px;}
  .score-inp{width:38px;height:38px;font-size:16px;}
}
</style>
</head>

<script>
const CFG = {
  FOOTBALL_API_KEY: "3ff849c2652846ce9a9b31910ab7cb98",
  N8N_BASE: "https://n8n.openip.cl/webhook",
  N8N_LOGIN:       "https://n8n.openip.cl/webhook/cm-login",

  N8N_GET_PREDS:   "https://n8n.openip.cl/webhook/cm-get-preds",
  N8N_LEADERBOARD: "https://n8n.openip.cl/webhook/cm-leaderboard",
  WC_COMPETITION: "WC",
  WC_SEASON: 2026,
  VALID_DOMAINS: ["apprecio.com","apprecio.pe","apprecio.co","apprecio.mx","apprecio.cl","apprecio.es"],
};

const FLAGS={CL:"🇨🇱",CO:"🇨🇴",MX:"🇲🇽",PE:"🇵🇪",ES:"🇪🇸",default:"🌍"};
const COUNTRY={CL:"Chile",CO:"Colombia",MX:"México",PE:"Perú",ES:"España"};
const PRIZES={CL:"$50.000 CLP",CO:"$250.000 COP",MX:"$1.020 MXN",PE:"S/ 250",ES:"Premio especial"};
const AV_COLORS=["","mint","lav","","mint"];

let user=null,allMatches=[],allUsers={},allPreds={};

function toast(msg,ms=2500){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),ms);}

function parseCSV(txt){
  const lines=txt.trim().split("\n");
  const heads=lines[0].split(",").map(h=>h.replace(/"/g,"").trim().toLowerCase());
  return lines.slice(1).map(l=>{
    const vals=l.match(/(".*?"|[^,]+)/g)||[];
    const o={};heads.forEach((h,i)=>{o[h]=(vals[i]||"").replace(/"/g,"").trim();});return o;
  });
}

function calcPts(pred,real){
  if(!pred||!real||pred.home===""||pred.away==="")return null;
  const ph=parseInt(pred.home),pa=parseInt(pred.away),rh=parseInt(real.home),ra=parseInt(real.away);
  if(isNaN(ph)||isNaN(pa)||isNaN(rh)||isNaN(ra))return null;
  if(ph===rh&&pa===ra)return 3;
  const pw=ph>pa?"H":ph<pa?"A":"D",rw=rh>ra?"H":rh<ra?"A":"D";
  return pw===rw?1:0;
}

function getUserPts(email){
  let pts=0;
  allMatches.forEach(m=>{
    const pred=allPreds[email]?.[m.id];
    const real=m.score?.fullTime;
    if(pred&&real?.home!=null&&real?.away!=null)pts+=calcPts(pred,{home:real.home,away:real.away})||0;
  });
  return pts;
}

function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();}

async function doLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  errEl.textContent="";
  if(!email){errEl.textContent="Ingresa tu correo corporativo.";return;}
  const domain=email.split("@")[1]||"";
  if(!CFG.VALID_DOMAINS.includes(domain)){errEl.textContent="Solo cuentas @apprecio. Contacta a tu equipo de Cultura si crees que es un error.";return;}
  btn.style.opacity="0.7";btn.innerHTML="<span>Cargando...</span>";
  try{
    // Login via n8n — el Sheet nunca se expone al browser
    const loginRes = await fetch(CFG.N8N_LOGIN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const loginData = await loginRes.json();
    if(!loginData.ok){ errEl.textContent = loginData.error || "Error al iniciar sesión."; btn.style.opacity="1"; btn.innerHTML="<span>Entrar</span><span>→</span>"; return; }
    allUsers[email] = { email, nombre: loginData.nombre, pais: loginData.pais };
    user = allUsers[email];
    await loadPredictions();
    await loadMatches();
    document.getElementById("navName").textContent=user.nombre||email.split("@")[0];

async function loadMatches(){
  document.getElementById("fixtureLoad").style.display="block";
  try{
    if(CFG.FOOTBALL_API_KEY==="3ff849c2652846ce9a9b31910ab7cb98"){
      allMatches=demoMatches();
      document.getElementById("syncLbl").innerHTML="⚠️ Modo demo <button class=\"refresh-btn\" onclick=\"loadMatches()\">↻</button>";
    } else {
      const r=await fetch(`https://api.football-data.org/v4/competitions/${CFG.WC_COMPETITION}/matches?season=${CFG.WC_SEASON}`,{headers:{"X-Auth-Token":CFG.FOOTBALL_API_KEY}});
      // Respect rate limit headers as recommended by football-data.org
      const remaining=r.headers.get("X-Requests-Available-Minute");
      if(remaining!==null&&parseInt(remaining)<2){
        toast("⏳ Límite de API alcanzado, intenta en 1 minuto");
        document.getElementById("fixtureLoad").style.display="none";
        return;
      }
      const data=await r.json();
      allMatches=(data.matches||[]).map(m=>({
        id:m.id,date:m.utcDate,stage:m.stage,group:m.group,
        homeTeam:m.homeTeam.name,awayTeam:m.awayTeam.name,
        homeFlag:tlaFlag(m.homeTeam.tla),awayFlag:tlaFlag(m.awayTeam.tla),
        status:m.status,score:m.score
      }));
      const now=new Date();
      document.getElementById("syncLbl").innerHTML=`Actualizado ${now.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})} <button class="refresh-btn" onclick="loadMatches()">↻</button>`;
    }
  }catch(e){allMatches=demoMatches();console.error(e);}
  document.getElementById("fixtureLoad").style.display="none";
  renderFixture();renderHome();renderTabla();
}

async function loadPredictions(){
  if(!user)return;
  try{
    const r = await fetch(`${CFG.N8N_GET_PREDS}?email=${encodeURIComponent(user.email)}`);
    const data = await r.json();
    if(data.ok && data.predictions){
      if(!allPreds[user.email]) allPreds[user.email]={};
      data.predictions.forEach(p => {
        allPreds[user.email][p.match_id] = { home: p.home_pred, away: p.away_pred };
      });
    }
  }catch(e){console.warn("Predictions load error",e);}
}

async function savePrediction(matchId,fromHome=false){
  const sfx=fromHome?"_h":"";
  const home=document.getElementById(`ph${sfx}_${matchId}`)?.value;
  const away=document.getElementById(`pa${sfx}_${matchId}`)?.value;
  if(home===""||home===undefined||away===""||away===undefined){toast("⚠️ Ingresa ambos marcadores");return;}
  if(!allPreds[user.email])allPreds[user.email]={};
  allPreds[user.email][matchId]={home,away};
  if(!CFG.N8N_SAVE_PRED.includes("TU_N8N")){
    fetch(CFG.N8N_SAVE_PRED,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:user.email,match_id:matchId,home_pred:home,away_pred:away,timestamp:new Date().toISOString()})}).catch(()=>{});
  }
  toast("✅ Pronóstico guardado");
  renderHome();renderTabla();
  if(!fromHome)renderFixture();
}

function renderHome(){
  const el=document.getElementById("homeContent");
  const email=user.email;
  const myPts=getUserPts(email);
  const predCount=Object.keys(allPreds[email]||{}).length;
  const ranked=Object.keys(allUsers).map(em=>({email:em,pts:getUserPts(em)})).sort((a,b)=>b.pts-a.pts);
  const myRank=ranked.findIndex(r=>r.email===email)+1;
  const pending=allMatches.filter(m=>{
    const isOpen=m.status==="TIMED"||m.status==="SCHEDULED"||m.status==="demo-open";
    return isOpen&&!allPreds[email]?.[m.id];
  }).slice(0,3);
  const recent=allMatches.filter(m=>m.status==="FINISHED").slice(-3).reverse();

  let h=`<div class="home-hero">
    <div class="home-hero-left">
      <div class="greet">Bienvenido Appeer</div>
      <div class="name">${(user.nombre||email.split("@")[0]).split(" ")[0]} <span>${FLAGS[user.pais]||""}</span></div>
    </div>
    <div class="home-hero-right">
      <div class="pts-val">${myPts}</div>
      <div class="pts-lbl">puntos</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="v">${myPts}</div><div class="l">Mis puntos</div></div>
    <div class="stat-box"><div class="v">${myRank||"—"}</div><div class="l">Posición</div></div>
    <div class="stat-box"><div class="v">${predCount}</div><div class="l">Pronósticos</div></div>
  </div>`;

  if(recent.length){
    h+=`<div class="phase-lbl">Últimos resultados</div>`;
    recent.forEach(m=>{
      const pred=allPreds[email]?.[m.id];
      const real=m.score?.fullTime;
      const pts=pred&&real?calcPts(pred,{home:real.home,away:real.away}):null;
      h+=`<div class="match-card">
        <div class="match-row">
          <div class="team-block"><span class="flag">${m.homeFlag||"🌍"}</span><span class="tname">${m.homeTeam}</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <span style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--dark)">${real?.home??"-"} : ${real?.away??"-"}</span>
            ${pts!==null?`<span class="pts-chip ${pts===3?"pts-exact":pts===1?"pts-winner":"pts-miss"}">${pts===3?"+3 exacto":pts===1?"+1 ganador":"0 pts"}</span>`:`<span style="font-size:10px;color:#ccc">sin pronóstico</span>`}
          </div>
          <div class="team-block away"><span class="flag">${m.awayFlag||"🌍"}</span><span class="tname">${m.awayTeam}</span></div>
        </div>
      </div>`;
    });
  }

  if(pending.length){
    h+=`<div class="phase-lbl">⚠️ Faltan tus pronósticos</div>`;
    pending.forEach(m=>{
      const dStr=m.date?new Date(m.date).toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):m.dateLabel||"";
      h+=`<div class="match-card highlight">
        <div class="match-meta"><span class="match-date">${dStr}</span><span class="badge badge-open">Abierto</span></div>
        <div class="match-row">
          <div class="team-block"><span class="flag">${m.homeFlag||"🌍"}</span><span class="tname">${m.homeTeam}</span></div>
          <div class="score-block">
            <input type="number" class="score-inp" id="ph_h_${m.id}" min="0" max="20" placeholder="-">
            <span class="sep">:</span>
            <input type="number" class="score-inp" id="pa_h_${m.id}" min="0" max="20" placeholder="-">
          </div>
          <div class="team-block away"><span class="flag">${m.awayFlag||"🌍"}</span><span class="tname">${m.awayTeam}</span></div>
        </div>
        <div class="match-foot"><span></span><button class="btn-save" onclick="savePrediction(${m.id},true)">Guardar pronóstico</button></div>
      </div>`;
    });
  }

  if(!recent.length&&!pending.length){
    h+=`<div class="empty"><div class="ic">⚽</div><p>El fixture se cargará próximamente con los partidos del Mundial 2026.</p></div>`;
  }
  el.innerHTML=h;
}

function renderFixture(){
  const el=document.getElementById("fixtureContent");
  if(!allMatches.length){el.innerHTML=`<div class="empty"><div class="ic">📅</div><p>Cargando partidos...</p></div>`;return;}
  const email=user.email;
  const groups={};
  allMatches.forEach(m=>{
    const k=m.group||m.stage||"Partidos";
    if(!groups[k])groups[k]=[];
    groups[k].push(m);
  });
  let h="";
  Object.entries(groups).forEach(([phase,matches])=>{
    h+=`<div class="phase-lbl">${phase.replace(/_/g," ")}</div>`;
    matches.forEach(m=>{
      const pred=allPreds[email]?.[m.id];
      const real=m.score?.fullTime;
      const isF=m.status==="FINISHED";
      const isO=m.status==="TIMED"||m.status==="SCHEDULED"||m.status==="demo-open";
      const pts=pred&&real?calcPts(pred,{home:real.home,away:real.away}):null;
      const dStr=m.date?new Date(m.date).toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):m.dateLabel||"";
      h+=`<div class="match-card">
        <div class="match-meta">
          <span class="match-date">${dStr}</span>
          <div class="badges">
            ${isF?`<span class="badge badge-played">✓ Jugado</span>`:""}
            ${isO?`<span class="badge badge-open">Abierto</span>`:""}
            ${!isO&&!isF?`<span class="badge badge-locked">Cerrado</span>`:""}
            ${pts!==null?`<span class="pts-chip ${pts===3?"pts-exact":pts===1?"pts-winner":"pts-miss"}">${pts===3?"+3":pts===1?"+1":"0"}</span>`:""}
          </div>
        </div>
        <div class="match-row">
          <div class="team-block"><span class="flag">${m.homeFlag||"🌍"}</span><span class="tname">${m.homeTeam}</span></div>
          <div class="score-block">
            <input type="number" class="score-inp" id="ph_${m.id}" min="0" max="20" value="${pred?pred.home:""}" placeholder="-" ${!isO?"disabled":""}>
            <span class="sep">:</span>
            <input type="number" class="score-inp" id="pa_${m.id}" min="0" max="20" value="${pred?pred.away:""}" placeholder="-" ${!isO?"disabled":""}>
          </div>
          <div class="team-block away"><span class="flag">${m.awayFlag||"🌍"}</span><span class="tname">${m.awayTeam}</span></div>
        </div>
        ${isF?`<div class="match-foot"><span class="real-res">Resultado real: <strong>${real?.home??"-"} : ${real?.away??"-"}</strong></span>${pts!==null?`<span class="pts-chip ${pts===3?"pts-exact":pts===1?"pts-winner":"pts-miss"}">${pts===3?"✓ Exacto 3pts":pts===1?"✓ Ganador 1pt":"✗ Sin puntos"}</span>`:""}</div>`:""}
        ${isO?`<div class="match-foot"><span style="font-size:11px;color:#aaa">Tu pronóstico</span><button class="btn-save" onclick="savePrediction(${m.id})">Guardar</button></div>`:""}
      </div>`;
    });
  });
  el.innerHTML=h;
}

function renderTabla(){
  const el=document.getElementById("tablaContent");
  const email=user.email;
  const emails=Object.keys(allUsers);
  if(!emails.length){el.innerHTML=`<div class="empty"><div class="ic">🏆</div><p>La tabla se mostrará cuando haya participantes.</p></div>`;return;}
  const ranked=emails.map((em,i)=>({
    email:em,nombre:allUsers[em]?.nombre||em.split("@")[0],pais:allUsers[em]?.pais||"",pts:getUserPts(em),idx:i
  })).sort((a,b)=>b.pts-a.pts).slice(0,10);
  const medals=["🥇","🥈","🥉"];
  let h=`<div class="podium">`;
  ranked.slice(0,3).forEach((u,i)=>{
    h+=`<div class="pod-card ${i===0?"p1":""}"><div class="pod-medal">${medals[i]}</div><div class="pod-name">${u.nombre.split(" ")[0]}</div><div class="pod-pts">${u.pts}</div><div class="pod-sub">${FLAGS[u.pais]||""} pts</div></div>`;
  });
  h+=`</div><div class="lb-list">`;
  ranked.forEach((u,i)=>{
    const isMe=u.email===email;
    const avClass=["","mint","lav","","mint","","lav"][i%7];
    h+=`<div class="lb-row ${isMe?"me":""}">
      <span class="lb-rank">${i+1}</span>
      <div class="lb-av ${avClass}">${initials(u.nombre)}</div>
      <div class="lb-info"><div class="lb-name">${u.nombre}${isMe?" (tú)":""}</div><div class="lb-country">${FLAGS[u.pais]||""} ${COUNTRY[u.pais]||""}</div></div>
      <div class="lb-pts">${u.pts}</div>
    </div>`;
  });
  h+=`</div>`;
  el.innerHTML=h;
}

function switchTab(name){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>{
    b.classList.toggle("active",["home","fixture","tabla","premios"][i]===name);
  });
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("panel-"+name).classList.add("active");
  if(name==="tabla")renderTabla();
  if(name==="fixture"&&!allMatches.length)loadMatches();
}
